name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Run unit tests (integration tests need local Postgres/Qdrant/Cognito — excluded here, see Task 9)
        env:
          # app/config.py reads these at import time even for tests that
          # never use them (test_guardrails.py imports it transitively via
          # app.auth) — dummy values are enough, nothing here connects to
          # a real service.
          LOCAL_DATABASE_URL: "postgresql+psycopg2://dummy:dummy@localhost:5433/dummy"
          COGNITO_REGION: "us-east-1"
          COGNITO_USER_POOL_ID: "dummy"
          COGNITO_APP_CLIENT_ID: "dummy"
          GEMINI_API_KEY: "dummy"
        run: pytest -m "not integration" -v

  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Get runner public IP
        id: ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)/32" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Authorize runner IP on EC2 security group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.ip }}"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/shopops
            git pull
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f

      - name: Revoke runner IP from EC2 security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.ip }}"
